name: Playwright CI - API & Database Validator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📦 Instalar dependencias
      run: npm ci

    - name: 🌐 Instalar navegadores de Playwright
      run: npx playwright install --with-deps

    - name: 🧪 Ejecutar pruebas de API y Base de Datos
      run: npx playwright test tests/api/users.spec.ts tests/database/persistency.spec.ts --workers=1

    - name: 📊 Subir reporte de Playwright como artefacto
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30